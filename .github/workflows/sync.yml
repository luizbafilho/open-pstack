name: sync

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main, sync/upstream]
    paths: ["rules/**", "src/**", "adapters/**"]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Check upstream
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          latest=$(gh api 'repos/cursor/plugins/commits?path=pstack&per_page=1' --jq '.[0].sha')
          current=$(git show origin/main:upstream/UPSTREAM.json | jq -r .sha)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ] && [ "$EVENT" != "push" ]; then
            echo "Snapshot is current at $current"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync
        if: steps.check.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create sync-held --force --color d93f0b --description "Upstream sync waiting for rewrite rules"

          # Rule fixes for a held sync are pushed to sync/upstream, where CI builds
          # the new snapshot. The script keeps that branch when it has them.
          .github/scripts/prepare-sync-branch.sh | tee prepare.log
          test "${PIPESTATUS[0]}" -eq 0
          base=$(tail -1 prepare.log | cut -d= -f2)

          version=$(jq -r .version upstream/UPSTREAM.json)
          title="sync: pstack $version (${LATEST:0:7})"
          open=$(gh pr list --head sync/upstream --state open --json number --jq length)

          set +e
          bun run build --report findings.md
          status=$?
          set -e

          publish() {
            if [ "$open" = "0" ]; then
              gh pr create --head sync/upstream --base main --title "$title" --body "$1"
            else
              gh pr edit sync/upstream --title "$title" --body "$1"
            fi
          }

          if [ "$status" -eq 0 ]; then
            git add upstream dist
            if git diff --cached --quiet; then
              if [ "$base" = "main" ]; then
                if [ "$open" != "0" ]; then gh pr close sync/upstream --delete-branch; fi
                exit 0
              fi
            elif git diff --cached --quiet -- upstream; then
              git commit -m "build: regenerate dist for $title"
            else
              git commit -m "$title"
            fi
            if [ "$base" = "main" ]; then git push -f origin sync/upstream; else git push origin sync/upstream; fi
            publish "Upstream pstack $version at cursor/plugins@$LATEST. The rewrite lint passed."
            if gh pr view sync/upstream --json labels --jq '.labels[].name' | grep -qx sync-held; then
              gh pr edit sync/upstream --remove-label sync-held
            fi
            gh pr merge sync/upstream --auto --squash
          else
            git add upstream
            git diff --cached --quiet || git commit -m "$title"
            if [ "$base" = "main" ]; then git push -f origin sync/upstream; else git push origin sync/upstream; fi
            held="Held: the rewrite lint found Cursor terms no rule covers. Push rule fixes to the \`sync/upstream\` branch. The sync reruns on top of them."
            publish "$(printf '%s\n\n%s\n' "$held" "$(cat findings.md)")"
            gh pr edit sync/upstream --add-label sync-held
            gh pr merge sync/upstream --disable-auto || true
          fi
